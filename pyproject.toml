[project]
name = "pdf-extractext"
version = "0.1.0"
description = "Extracción de texto desde PDFs con FastAPI + MongoDB"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "pymongo>=4.6",
    "pypdf>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "fpdf2>=2.8.7",
    "httpx>=0.28.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
