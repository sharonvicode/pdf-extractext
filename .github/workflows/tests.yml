name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Instalar Python
        run: uv python install 3.12

      - name: Instalar dependencias
        run: uv sync

      - name: Tests
        run: uv run pytest tests/ -v
