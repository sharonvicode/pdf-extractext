[project]
name = "extractor-service"
version = "0.1.0"
description = "Microservicio extractor de texto de PDFs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "pypdf>=5.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "fpdf2>=2.8.7",
]
